name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-19]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-19 clang-tools-19
      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ../vcpkg
          ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-19 clang-tools-19
      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ../vcpkg
          ../vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --preset asan -DCMAKE_CXX_COMPILER=clang++-19
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan